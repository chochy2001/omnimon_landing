name: Landing CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    # Public repo: GitHub-hosted free minutes, frees self-hosted capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Advisories are a gate, not a local courtesy: bun audit exits 1 when
      # the locked tree has a known vulnerability, so this step fails the job
      # instead of letting a CVE batch sit on main behind green tests.
      - name: Dependency advisories (bun audit)
        run: bun audit

      - name: Build
        run: bun run build

      - name: Install Chromium for responsive smoke
        run: bunx playwright install chromium

      - name: Test
        run: bun run test

      - name: Deploy FTPS identity and strictness tests
        run: |
          bash scripts/tests/ftps_identity_test.sh
          bash scripts/tests/png_compare_test.sh
          bash scripts/tests/robots_check_test.sh
          bash scripts/tests/deploy_asset_gate_test.sh
          bash scripts/tests/deploy_strict_contract_test.sh
          bash scripts/tests/version_json_test.sh
