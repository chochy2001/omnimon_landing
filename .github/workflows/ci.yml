name: Landing CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    # Public repo: GitHub-hosted free minutes, frees self-hosted capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Advisories are a gate, not a local courtesy: bun audit exits 1 when
      # the locked tree has a known vulnerability, so this step fails the job
      # instead of letting a CVE batch sit on main behind green tests.
      - name: Dependency advisories (bun audit)
        run: bun audit

      - name: Test
        run: bun run test

      - name: Deploy FTPS identity and strictness tests
        run: |
          bash scripts/tests/ftps_identity_test.sh
          bash scripts/tests/png_compare_test.sh
          bash scripts/tests/deploy_strict_contract_test.sh

      - name: Build
        run: bun run build
